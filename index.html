<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucky Wheel</title>
<meta name="description" content="Lucky Wheel">
<style>
:root{--red:#e20a16;--gold:#ffd700;--black:#070707;--panel:#151515;--muted:#b9b9b9}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070707;color:#fff;font-family:Inter,Arial,sans-serif;background-size:cover;background-position:center;background-attachment:fixed}.overlay{min-height:100vh;background:radial-gradient(circle at 50% 35%,#36080c99,#070707ee 70%);padding:28px}.wrap{max-width:1200px;margin:auto}.brand{text-align:center;margin:10px 0 18px}.brand img{max-height:80px;max-width:220px;object-fit:contain}.brand h1{margin:8px 0 4px;font-size:clamp(26px,5vw,48px)}.brand p{color:#ccc;margin:0}.card{background:#101010dd;border:1px solid #ffffff20;border-radius:22px;padding:26px;box-shadow:0 25px 80px #0008;backdrop-filter:blur(10px)}.wheel-area{display:grid;grid-template-columns:minmax(340px,1.35fr) 330px;gap:32px;align-items:center}.wheel-box{position:relative;display:flex;justify-content:center;align-items:flex-start;padding-top:46px}.pointer{position:absolute;top:0;z-index:4;width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:46px solid var(--gold);filter:drop-shadow(0 4px 8px #000)}canvas{display:block}.control h2{margin-top:0}.control input{width:100%;padding:15px 16px;border-radius:12px;border:1px solid #ffffff22;background:#050505;color:#fff;font-size:16px}.btn{width:100%;margin-top:12px;padding:15px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--red),#7d0007);color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}.note{color:#aaa;font-size:13px;line-height:1.5}.result{display:none;margin-top:18px;padding:16px;border-radius:14px;background:#0b4d16;border:1px solid #51d46a;color:#fff}.result.show{display:block}.welcome{position:fixed;inset:0;background:#000b;z-index:20;display:grid;place-items:center;padding:20px}.welcome.hide{display:none}.welcome-box{max-width:650px;background:#f3f3f3;color:#222;padding:28px;border-radius:20px;text-align:center}.welcome-box button{background:#168a32;color:#fff;border:0;padding:13px 22px;border-radius:10px;font-weight:800}.footer{text-align:center;color:#777;padding:20px}.hidden{display:none!important}@media(max-width:800px){.wheel-area{grid-template-columns:1fr}.card{padding:14px}}
</style>
</head>
<body>
<div class="overlay"><div class="wrap">
<header class="brand"><img id="logo" class="hidden"><h1 id="siteTitle">RODA KEBERUNTUNGAN</h1><p id="subtitle">Masukkan kode tiket untuk memulai putaran.</p></header>
<main class="card wheel-area"><section class="wheel-box" id="wheelBox"><div class="pointer" id="pointer"></div><canvas id="wheel" width="520" height="520"></canvas></section><section class="control"><h2>Masukkan Kode Tiket</h2><input id="code" placeholder="Masukkan Kode" autocomplete="off"><button class="btn" id="spinBtn">SPIN</button><div class="result" id="result"></div><p class="note">Setiap kode aktif hanya dapat digunakan satu kali.</p></section></main>
<footer class="footer" id="footer"></footer></div></div>
<div class="welcome" id="welcome"><div class="welcome-box"><h2 id="welcomeTitle"></h2><p id="welcomeText"></p><button id="agree">Oke, Terima Kasih</button></div></div>
<script src="https://cdn.jsdelivr.net/gh/zarocknz/javascript-winwheel@2.8.0/Winwheel.min.js"></script>
<script>
let cfg, wheel, spinning=false;
const $=id=>document.getElementById(id);
function applyConfig(c){cfg=c; document.documentElement.style.setProperty('--red',c.site.primaryColor);document.documentElement.style.setProperty('--gold',c.site.secondaryColor);$('siteTitle').textContent=c.site.name;$('subtitle').textContent=c.site.subtitle;$('footer').textContent=c.site.footerText||'';document.title=c.site.title||c.site.name;if(c.site.backgroundUrl)document.body.style.backgroundImage=`url(${CSS.escape(c.site.backgroundUrl)})`;if(c.site.logoUrl){$('logo').src=c.site.logoUrl;$('logo').classList.remove('hidden')}else $('logo').classList.add('hidden');$('welcomeTitle').textContent=c.site.welcomeTitle;$('welcomeText').textContent=c.site.welcomeText;if(c.site.showWelcome!==false&&!sessionStorage.getItem('sw_welcome'))$('welcome').classList.remove('hide');else $('welcome').classList.add('hide');drawWheel();}

function drawWheel(){
  const seg = cfg.wheel.segments.filter(s => s.enabled !== false);
  if (!seg.length) return;

  // Pengaturan admin (Outer/Inner Radius) hanya dipakai untuk RASIO
  // lubang tengah terhadap roda, bukan ukuran piksel langsung — ukuran
  // akhir di layar selalu menyesuaikan lebar kotak roda yang tersedia.
  const cfgOuter = Math.max(60, Number(cfg.wheel.outerRadius) || 220);
  const cfgInner = Math.max(0, Number(cfg.wheel.innerRadius) || 60);
  const innerFraction = Math.min(0.85, cfgInner / cfgOuter);

  const wheelBox = document.getElementById('wheelBox');
  const cssSize = Math.max(240, Math.round(wheelBox.clientWidth || 400));
  const cssMargin = Math.max(6, Math.round(cssSize * 0.02));
  const outerRcss = (cssSize / 2) - cssMargin;
  const innerRcss = outerRcss * innerFraction;

  // Render di resolusi lebih tinggi (devicePixelRatio) supaya tajam,
  // tapi semua perhitungan di atas tetap dalam satuan CSS px yang mudah dikontrol.
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const pixelSize = Math.round(cssSize * dpr);

  const canvas = document.getElementById('wheel');
  canvas.width = pixelSize;
  canvas.height = pixelSize;
  canvas.style.width = cssSize + 'px';
  canvas.style.height = cssSize + 'px';

  $('pointer').style.top = cssMargin + 'px';

  // Batas lebar teks (dalam CSS px dulu) supaya tidak mepet tepi luar
  // maupun turun sampai tertutup lubang tengah.
  const textMarginCss = Math.max(6, Math.round(outerRcss * 0.15));
  const availableBandCss = (outerRcss - textMarginCss) - innerRcss;
  const maxTextWidthCss = Math.max(12, availableBandCss * 0.85);

  const measureCtx = document.createElement('canvas').getContext('2d');
  function widthAt(fontSizeCss, text){
    measureCtx.font = `bold ${fontSizeCss}px Arial, sans-serif`;
    return measureCtx.measureText(text).width;
  }

  const baseFontCss = Number(cfg.wheel.textFontSize) || 18;
  let fontSizeCss = Math.min(baseFontCss, Math.round(outerRcss * 0.45));
  const minFontCss = 7;
  while (fontSizeCss > minFontCss && seg.some(s => widthAt(fontSizeCss, String(s.label || '')) > maxTextWidthCss)) {
    fontSizeCss -= 1;
  }

  wheel = new Winwheel({
    canvasId: 'wheel',
    centerX: pixelSize / 2,
    centerY: pixelSize / 2,
    numSegments: seg.length,
    outerRadius: outerRcss * dpr,
    innerRadius: innerRcss * dpr,
    textFontSize: fontSizeCss * dpr,
    textFontFamily: 'Arial, sans-serif',
    textMargin: textMarginCss * dpr,
    textAlignment: 'outer',
    segments: seg.map(s => ({ fillStyle: s.color, text: s.label, textFillStyle: s.textColor })),
    animation: { type: 'spinToStop', duration: Number(cfg.wheel.duration) || 4, spins: Number(cfg.wheel.spins) || 10 }
  });
}

async function load(){const r=await fetch('/api/public-config',{cache:'no-store'});if(!r.ok)throw new Error('Gagal memuat konfigurasi');applyConfig(await r.json())}
let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (cfg) drawWheel(); }, 150); });
$('agree').onclick=()=>{sessionStorage.setItem('sw_welcome','1');$('welcome').classList.add('hide')};
$('spinBtn').onclick=async()=>{if(spinning)return;const code=$('code').value.trim();if(!code){alert('Masukkan Kode Tiket Terlebih Dahulu');return}spinning=true;$('spinBtn').disabled=true;$('result').classList.remove('show');try{const r=await fetch('/api/spin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Gagal memproses kode');const idx=cfg.wheel.segments.findIndex(s=>s.id===d.prize.id);const active=cfg.wheel.segments.filter(s=>s.enabled!==false);const activeIdx=active.findIndex(s=>s.id===d.prize.id);wheel.animation.stopAngle=wheel.getRandomForSegment(activeIdx+1);wheel.animation.callbackFinished=()=>{const msg=(cfg.messages.winText||'Anda memenangkan {PRIZE}!').replaceAll('{PRIZE}',d.prize.label);$('result').innerHTML='<b>'+escapeHtml(cfg.messages.winTitle||'SELAMAT!')+'</b><br>'+escapeHtml(msg)+'<br><small>Kode: '+escapeHtml(d.code)+'</small>';if(cfg.claim.whatsapp){const text=(cfg.claim.whatsappMessage||'').replaceAll('{CODE}',d.code).replaceAll('{PRIZE}',d.prize.label);$('result').innerHTML+='<br><a style="color:#ffd700" target="_blank" href="https://wa.me/'+encodeURIComponent(cfg.claim.whatsapp)+'?text='+encodeURIComponent(text)+'">'+escapeHtml(cfg.claim.claimLabel||'Klaim Melalui WhatsApp')+'</a>'}$('result').classList.add('show');spinning=false;$('spinBtn').disabled=false;$('code').value=''};wheel.startAnimation();}catch(e){alert(e.message);spinning=false;$('spinBtn').disabled=false}};
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
load().catch(e=>{document.querySelector('.control').insertAdjacentHTML('beforeend','<p style="color:#ff7777">'+escapeHtml(e.message)+'</p>')});
</script>
</body></html>
