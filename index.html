<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucky Wheel</title>
<link rel="icon" id="favicon" href="/favicon.svg">
<meta name="description" content="Lucky Wheel">
<style>
:root{--red:#e20a16;--gold:#ffd700;--black:#070707;--panel:#151515;--muted:#b9b9b9}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--body-bg,radial-gradient(circle at 50% 30%,#2a1035,#0d0710 75%));color:#fff;font-family:Inter,Arial,sans-serif;background-size:cover;background-position:center;background-attachment:fixed}#bgVideo{opacity:0;transition:opacity .6s ease}#bgVideo.ready{opacity:1}.overlay{min-height:100vh;background:radial-gradient(circle at 50% 35%,#36080c99,#070707ee 70%);padding:28px}.wrap{max-width:1200px;margin:auto}.brand{text-align:center;margin:10px 0 18px}.brand img{max-height:80px;max-width:220px;object-fit:contain}.brand h1{margin:8px 0 4px;font-size:clamp(26px,5vw,48px)}.brand p{color:#ccc;margin:0}.card{background:var(--card-bg,#101010dd);border:1px solid #ffffff20;border-radius:22px;padding:26px;box-shadow:0 25px 80px #0008;backdrop-filter:blur(10px)}.wheel-area{display:grid;grid-template-columns:minmax(340px,1.35fr) 330px;gap:32px;align-items:center}.wheel-box{position:relative;display:flex;justify-content:center;align-items:flex-start;padding-top:46px;max-width:100%;overflow:hidden}canvas{display:block;max-width:100%;height:auto}.pointer{position:absolute;top:0;z-index:4;width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:46px solid var(--pointer-color,var(--gold));filter:drop-shadow(0 4px 8px #000)}.pointer.pointer-img{width:40px;height:46px;border:0;background-size:contain;background-repeat:no-repeat;background-position:center}.hub-logo{position:absolute;z-index:3;border-radius:50%;background:#0a0a0a;background-size:100%;background-repeat:no-repeat;background-position:center;box-shadow:inset 0 0 0 2px #ffffff22;pointer-events:none}canvas{display:block}.control h2{margin-top:0;color:var(--ctrl-title,#fff)}.control input{width:100%;padding:15px 16px;border-radius:12px;border:1px solid #ffffff22;background:var(--ctrl-input-bg,#050505);color:var(--ctrl-input-text,#fff);font-size:16px;margin-bottom:6px;box-shadow:var(--ctrl-shadow-input,0 14px 0 -6px rgba(0,0,0,.35),0 18px 30px -4px rgba(0,0,0,.75),0 8px 20px rgba(226,10,22,.3))}.btn{width:100%;margin-top:12px;margin-bottom:6px;padding:15px;border:0;border-radius:12px;background:var(--ctrl-btn-bg,linear-gradient(135deg,var(--red),#7d0007));color:var(--ctrl-btn-text,#fff);font-weight:800;cursor:pointer;box-shadow:var(--ctrl-shadow-btn,0 16px 0 -6px rgba(0,0,0,.4),0 22px 34px -4px rgba(0,0,0,.8),0 10px 24px rgba(226,10,22,.45))}.btn:disabled{opacity:.5;cursor:not-allowed}.note{color:var(--ctrl-note,#aaa);font-size:13px;line-height:1.5}.result{display:none;margin-top:18px;padding:16px;border-radius:14px;background:#0b4d16;border:1px solid #51d46a;color:#fff}.result.show{display:block}.welcome{position:fixed;inset:0;background:#000b;z-index:20;display:grid;place-items:center;padding:20px}.welcome.hide{display:none}.welcome-box{max-width:650px;background:#f3f3f3;color:#222;padding:28px;border-radius:20px;text-align:center}.welcome-box button{background:#168a32;color:#fff;border:0;padding:13px 22px;border-radius:10px;font-weight:800}.footer{text-align:center;color:#777;padding:20px}.hidden{display:none!important}@media(max-width:800px){.wheel-area{grid-template-columns:1fr}.card{padding:14px}.control{text-align:center}.control h2{text-align:center}.control input{text-align:center}.note{text-align:center}}
</style>

<body>
<video id="bgVideo" autoplay muted loop playsinline preload="auto" style="position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;display:none"></video>
<canvas id="bgEffects" style="position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;"></canvas>
<div class="overlay"><div class="wrap">
<header class="brand"><img id="logo" class="hidden"><h1 id="siteTitle">RODA KEBERUNTUNGAN</h1><p id="subtitle">Masukkan kode tiket untuk memulai putaran.</p></header>
<main class="card wheel-area"><section class="wheel-box" id="wheelBox"><div class="pointer" id="pointer"></div><canvas id="wheel" width="520" height="520"></canvas><div class="hub-logo" id="hubLogo"></div></section><section class="control"><h2>Masukkan Kode Tiket</h2><input id="code" placeholder="Masukkan Kode" autocomplete="off"><button class="btn" id="spinBtn">SPIN</button><div class="result" id="result"></div><p class="note">Setiap kode aktif hanya dapat digunakan satu kali.</p></section></main>
<footer class="footer" id="footer"></footer></div></div>
<div class="welcome" id="welcome"><div class="welcome-box"><h2 id="welcomeTitle"></h2><p id="welcomeText"></p><button id="agree">Oke, Terima Kasih</button></div></div>
<script src="https://cdn.jsdelivr.net/gh/zarocknz/javascript-winwheel@2.8.0/Winwheel.min.js"></script>
<script>
let cfg, wheel, spinning=false;
const $=id=>document.getElementById(id);
function applyConfig(c){cfg=c; document.documentElement.style.setProperty('--red',c.site.primaryColor);document.documentElement.style.setProperty('--gold',c.site.secondaryColor);$('siteTitle').textContent=c.site.name;$('subtitle').textContent=c.site.subtitle;$('footer').textContent=c.site.footerText||'';document.title=c.site.title||c.site.name;const favEl=document.getElementById('favicon');if(c.site.faviconUrl&&favEl)favEl.href=c.site.faviconUrl;applyBackground();applyPointer();applyCardBg();applyTextColors();applyBodyBgColor();applyControlColors();if(c.site.logoUrl){$('logo').src=c.site.logoUrl;$('logo').classList.remove('hidden')}else $('logo').classList.add('hidden');$('welcomeTitle').textContent=c.site.welcomeTitle;$('welcomeText').textContent=c.site.welcomeText;if(c.site.showWelcome!==false&&!sessionStorage.getItem('sw_welcome'))$('welcome').classList.remove('hide');else $('welcome').classList.add('hide');drawWheel();}

function applyBackground(){
  if(!cfg || !cfg.site) return;
  const isDesktop = window.matchMedia('(min-width:800px)').matches;
  const url = (isDesktop && cfg.site.backgroundUrlDesktop) ? cfg.site.backgroundUrlDesktop : (cfg.site.backgroundUrl || '');
  const bgVideo = document.getElementById('bgVideo');
  if(!url){
    bgVideo.style.display='none';bgVideo.removeAttribute('src');bgVideo.classList.remove('ready');
    document.body.style.backgroundImage='none';
    document.querySelector('.overlay').style.background='';
    return;
  }
  const isVideo=/\.(mp4|webm|mov)$/i.test(url);
  if(isVideo){
    if(bgVideo.getAttribute('src')!==url){
      bgVideo.classList.remove('ready');
      bgVideo.src=url;
      bgVideo.addEventListener('canplay', ()=>bgVideo.classList.add('ready'), {once:true});
    }
    bgVideo.style.display='block';
    document.body.style.backgroundImage='none';
    document.querySelector('.overlay').style.background='rgba(7,7,7,0.55)';
  }else{
    bgVideo.style.display='none';bgVideo.removeAttribute('src');bgVideo.classList.remove('ready');
    document.body.style.backgroundImage=`url(${CSS.escape(url)})`;
    document.querySelector('.overlay').style.background='';
  }
}

function applyPointer(){
  if(!cfg || !cfg.site) return;
  document.documentElement.style.setProperty('--pointer-color', cfg.site.pointerColor || cfg.site.secondaryColor || '#ffd700');
  const pointerEl = document.getElementById('pointer');
  if(cfg.site.pointerImageUrl){
    pointerEl.classList.add('pointer-img');
    pointerEl.style.backgroundImage = `url(${CSS.escape(cfg.site.pointerImageUrl)})`;
    const w = Number(cfg.site.pointerWidth) || 40;
    const h = Number(cfg.site.pointerHeight) || 46;
    pointerEl.style.width = w + 'px';
    pointerEl.style.height = h + 'px';
  }else{
    pointerEl.classList.remove('pointer-img');
    pointerEl.style.backgroundImage = 'none';
    pointerEl.style.width = '';
    pointerEl.style.height = '';
  }
}

function applyTextColors(){
  if(!cfg || !cfg.site) return;
  $('siteTitle').style.color = cfg.site.titleColor || '';
  $('subtitle').style.color = cfg.site.subtitleColor || '';
  $('footer').style.color = cfg.site.footerColor || '';
}

function applyControlColors(){
  if(!cfg || !cfg.site) return;
  const root = document.documentElement.style;
  root.setProperty('--ctrl-title', cfg.site.controlTitleColor || '#fff');
  root.setProperty('--ctrl-input-bg', cfg.site.inputBgColor || '#050505');
  root.setProperty('--ctrl-input-text', cfg.site.inputTextColor || '#fff');
  root.setProperty('--ctrl-btn-bg', cfg.site.btnColor ? cfg.site.btnColor : `linear-gradient(135deg,${cfg.site.primaryColor||'#e20a16'},#7d0007)`);
  root.setProperty('--ctrl-btn-text', cfg.site.btnTextColor || '#fff');
  root.setProperty('--ctrl-note', cfg.site.noteColor || '#aaa');

  const accent = cfg.site.primaryColor || '#e20a16';
  const rimColor = cfg.site.secondaryColor || '#ffd700';
  const variants = {
    none: { input:'none', btn:'none' },
    soft: {
      input:'0 8px 18px rgba(0,0,0,.4)',
      btn:'0 10px 22px rgba(0,0,0,.45)'
    },
    strong: {
      input:`0 14px 0 -6px rgba(0,0,0,.35),0 18px 30px -4px rgba(0,0,0,.75),0 8px 20px ${hexToRgba(accent,0.3)}`,
      btn:`0 16px 0 -6px rgba(0,0,0,.4),0 22px 34px -4px rgba(0,0,0,.8),0 10px 24px ${hexToRgba(accent,0.45)}`
    },
    glow: {
      input:`0 0 0 1px ${hexToRgba(accent,0.4)},0 10px 30px ${hexToRgba(accent,0.5)}`,
      btn:`0 0 0 1px ${hexToRgba(accent,0.5)},0 12px 34px ${hexToRgba(accent,0.65)}`
    },
    neon: {
      input:`0 0 10px ${hexToRgba(accent,0.8)},0 0 24px ${hexToRgba(accent,0.5)},0 14px 26px rgba(0,0,0,.6)`,
      btn:`0 0 14px ${hexToRgba(accent,0.9)},0 0 32px ${hexToRgba(accent,0.6)},0 16px 30px rgba(0,0,0,.65)`
    },
    rim: {
      input:`inset 0 -2px 0 ${hexToRgba(rimColor,0.7)},0 4px 0 -1px ${hexToRgba(rimColor,0.55)},0 10px 20px rgba(0,0,0,.6)`,
      btn:`inset 0 -2px 0 ${hexToRgba(rimColor,0.85)},0 4px 0 -1px ${hexToRgba(rimColor,0.7)},0 6px 16px ${hexToRgba(rimColor,0.35)},0 12px 24px rgba(0,0,0,.65)`
    }
  };
  const variant = variants[cfg.site.shadowVariant] || variants.strong;
  root.setProperty('--ctrl-shadow-input', variant.input);
  root.setProperty('--ctrl-shadow-btn', variant.btn);
}

function hexToRgba(hex, alpha){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex||'');
  if(!m) return `rgba(226,10,22,${alpha})`;
  const n = parseInt(m[1],16);
  const r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  return `rgba(${r},${g},${b},${alpha})`;
}

function applyBodyBgColor(){
  if(!cfg || !cfg.site) return;
  const isDesktop = window.matchMedia('(min-width:800px)').matches;
  const color = isDesktop ? (cfg.site.bodyBgColorDesktop || cfg.site.bodyBgColorMobile) : (cfg.site.bodyBgColorMobile || cfg.site.bodyBgColorDesktop);
  document.documentElement.style.setProperty('--body-bg', color || 'radial-gradient(circle at 50% 30%,#2a1035,#0d0710 75%)');
}

function applyCardBg(){
  if(!cfg || !cfg.site) return;
  const color = cfg.site.cardBgColor || '#101010dd';
  const img = cfg.site.cardBgImage || '';
  document.documentElement.style.setProperty('--card-bg', img ? `url(${CSS.escape(img)}) center/cover` : color);
}

function getWheelCssSize(){
  const wheelBox = document.getElementById('wheelBox');
  const containerSize = Math.round(wheelBox.clientWidth || 400);
  const maxSize = Number(cfg.wheel.maxSize) || 0;
  const capped = maxSize > 0 ? Math.min(containerSize, maxSize) : containerSize;
  return Math.max(180, capped);
}

function drawCustomImageWheel(seg, imageUrl){
  $('hubLogo').style.display = 'none'; // gambar custom sudah termasuk lubang tengah, hub logo bawaan disembunyikan

  const cssSize = getWheelCssSize();
  const cssMargin = Math.max(18, Math.round(cssSize * 0.075));
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const pixelSize = Math.round(cssSize * dpr);

  const canvas = document.getElementById('wheel');
  canvas.width = pixelSize;
  canvas.height = pixelSize;
  canvas.style.width = cssSize + 'px';

  $('pointer').style.top = cssMargin + 'px';

  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    wheel = new Winwheel({
      canvasId: 'wheel',
      centerX: pixelSize / 2,
      centerY: pixelSize / 2,
      drawMode: 'image',
      wheelImage: img,
      numSegments: seg.length,
      segments: seg.map(() => ({})),
      animation: { type: 'spinToStop', duration: Number(cfg.wheel.duration) || 4, spins: Number(cfg.wheel.spins) || 10 }
    });
    wheel.draw();
  };
  img.src = imageUrl;
}

function drawWheel(){
  const seg = cfg.wheel.segments.filter(s => s.enabled !== false);
  if (!seg.length) return;

  const customImg = cfg.site.customWheelImage;
  if(customImg){
    drawCustomImageWheel(seg, customImg);
    return;
  }
  $('hubLogo').style.display = '';

  // Pengaturan admin (Outer/Inner Radius) hanya dipakai untuk RASIO
  // lubang tengah terhadap roda, bukan ukuran piksel langsung — ukuran
  // akhir di layar selalu menyesuaikan lebar kotak roda yang tersedia
  // (dibatasi oleh "Ukuran Wheel Maksimal" kalau diisi).
  const cfgOuter = Math.max(60, Number(cfg.wheel.outerRadius) || 220);
  const cfgInner = Math.max(0, Number(cfg.wheel.innerRadius) || 60);
  const innerFraction = Math.min(0.85, cfgInner / cfgOuter);

  const cssSize = getWheelCssSize();
  const cssMargin = Math.max(18, Math.round(cssSize * 0.075));
  const outerRcss = (cssSize / 2) - cssMargin;
  const innerRcss = outerRcss * innerFraction;

  // Render di resolusi lebih tinggi (devicePixelRatio) supaya tajam,
  // tapi semua perhitungan di atas tetap dalam satuan CSS px yang mudah dikontrol.
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const pixelSize = Math.round(cssSize * dpr);

  const canvas = document.getElementById('wheel');
  canvas.width = pixelSize;
  canvas.height = pixelSize;
  canvas.style.width = cssSize + 'px';
  // Tinggi TIDAK di-set manual di sini — dibiarkan mengikuti CSS
  // (height:auto) supaya roda tetap presisi persegi walau lebar
  // dibatasi oleh max-width:100% (jaring pengaman anti-meluber).

  $('pointer').style.top = cssMargin + 'px';

  // Logo di tengah roda mengikuti ukuran & posisi lubang tengah (innerRadius).
  const hub = $('hubLogo');
  const hubDiameter = Math.round(innerRcss * 2 * 0.86);
  hub.style.width = hubDiameter + 'px';
  hub.style.height = hubDiameter + 'px';
  hub.style.left = Math.round(cssSize / 2 - hubDiameter / 2) + 'px';
  // POINTER_RESERVE (46px) = jarak canvas dari atas wheel-box, karena
  // wheel-box punya padding-top:46px untuk tempat pointer. Sebelumnya
  // angka ini tidak ikut dihitung, jadi logo tampak naik/tidak pas tengah.
  const POINTER_RESERVE = 46;
  hub.style.top = Math.round(POINTER_RESERVE + cssMargin + outerRcss - hubDiameter / 2) + 'px';
  hub.style.backgroundColor = cfg.site.wheelHubColor || '#0a0a0a';
  hub.style.backgroundImage = cfg.site.wheelLogoUrl ? `url(${CSS.escape(cfg.site.wheelLogoUrl)})` : 'none';
  hub.style.backgroundSize = '100%';
hub.style.backgroundRepeat = 'no-repeat';

  // Batas lebar teks (dalam CSS px) supaya tidak mepet tepi luar
  // maupun turun sampai tertutup lubang tengah.
  const textMarginCss = Math.max(6, Math.round(outerRcss * 0.12));
  const availableBandCss = (outerRcss - textMarginCss) - innerRcss;
  const maxTextWidthCss = Math.max(12, availableBandCss * 0.92);

  const measureCtx = document.createElement('canvas').getContext('2d');
  function widthAt(fontSizeCss, text){
    measureCtx.font = `bold ${fontSizeCss}px Arial, sans-serif`;
    return measureCtx.measureText(text).width;
  }

  const baseFontCss = Number(cfg.wheel.textFontSize) || 18;
  let fontSizeCss = Math.min(baseFontCss, Math.round(outerRcss * 0.45));
  const minFontCss = 7;
  while (fontSizeCss > minFontCss && seg.some(s => widthAt(fontSizeCss, String(s.label || '')) > maxTextWidthCss)) {
    fontSizeCss -= 1;
  }

  // Winwheel HANYA dipakai untuk menggambar juring warna (itu sudah
  // selalu tepat) — teks TIDAK diserahkan ke Winwheel karena mesin
  // teks bawaannya sering memotong kata secara tidak konsisten.
  wheel = new Winwheel({
    canvasId: 'wheel',
    centerX: pixelSize / 2,
    centerY: pixelSize / 2,
    numSegments: seg.length,
    outerRadius: outerRcss * dpr,
    innerRadius: innerRcss * dpr,
    segments: seg.map(s => ({ fillStyle: s.color, text: '' })),
    animation: { type: 'spinToStop', duration: Number(cfg.wheel.duration) || 4, spins: Number(cfg.wheel.spins) || 10 }
  });

  drawLabels(seg, pixelSize, outerRcss, innerRcss, fontSizeCss, dpr);
}

function drawLabels(seg, pixelSize, outerRcss, innerRcss, fontSizeCss, dpr){
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const midRadius = ((innerRcss + outerRcss) / 2) * dpr;
  const angleStep = 360 / seg.length;

  seg.forEach((s, i) => {
    // 0 derajat Winwheel = arah jam 12 (atas), searah jarum jam — sama
    // seperti posisi juring warna yang sudah tergambar oleh Winwheel.
    const midAngleDeg = angleStep * i + angleStep / 2;
    const canvasAngleRad = (midAngleDeg - 90) * Math.PI / 180;

    ctx.save();
    ctx.translate(pixelSize / 2, pixelSize / 2);
    ctx.rotate(canvasAngleRad);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = s.textColor || '#ffffff';
    ctx.font = `bold ${fontSizeCss * dpr}px Arial, sans-serif`;
    ctx.fillText(String(s.label || ''), midRadius, 0);
    ctx.restore();
  });
}

async function load(){const r=await fetch('/api/public-config',{cache:'no-store'});if(!r.ok)throw new Error('Gagal memuat konfigurasi');applyConfig(await r.json());const urlCode=new URLSearchParams(location.search).get('code');if(urlCode)$('code').value=urlCode.trim().toUpperCase()}
let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (cfg) { drawWheel(); applyBackground(); applyBodyBgColor(); } }, 150); });
if (window.ResizeObserver) {
  new ResizeObserver(() => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (cfg) drawWheel(); }, 120);
  }).observe($('wheelBox'));
}
$('agree').onclick=()=>{sessionStorage.setItem('sw_welcome','1');$('welcome').classList.add('hide')};
$('spinBtn').onclick=async()=>{if(spinning)return;const code=$('code').value.trim();if(!code){alert('Masukkan Kode Tiket Terlebih Dahulu');return}spinning=true;$('spinBtn').disabled=true;$('result').classList.remove('show');try{const r=await fetch('/api/spin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Gagal memproses kode');const idx=cfg.wheel.segments.findIndex(s=>s.id===d.prize.id);const active=cfg.wheel.segments.filter(s=>s.enabled!==false);const activeIdx=active.findIndex(s=>s.id===d.prize.id);wheel.animation.stopAngle=wheel.getRandomForSegment(activeIdx+1);wheel.animation.callbackFinished=()=>{const msg=(cfg.messages.winText||'Anda memenangkan {PRIZE}!').replaceAll('{PRIZE}',d.prize.label);$('result').innerHTML='<b>'+escapeHtml(cfg.messages.winTitle||'SELAMAT!')+'</b><br>'+escapeHtml(msg)+'<br><small>Kode: '+escapeHtml(d.code)+'</small>';if(cfg.claim.whatsapp){const text=(cfg.claim.whatsappMessage||'').replaceAll('{CODE}',d.code).replaceAll('{PRIZE}',d.prize.label);$('result').innerHTML+='<br><a style="color:#ffd700" target="_blank" href="https://wa.me/'+encodeURIComponent(cfg.claim.whatsapp)+'?text='+encodeURIComponent(text)+'">'+escapeHtml(cfg.claim.claimLabel||'Klaim Melalui WhatsApp')+'</a>'}$('result').classList.add('show');spinning=false;$('spinBtn').disabled=false;$('code').value=''};wheel.startAnimation();}catch(e){alert(e.message);spinning=false;$('spinBtn').disabled=false}};
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
load().catch(e=>{document.querySelector('.control').insertAdjacentHTML('beforeend','<p style="color:#ff7777">'+escapeHtml(e.message)+'</p>')});
</script>
<script>
(function(){
  const canvas = document.getElementById('bgEffects');
  const ctx = canvas.getContext('2d');
  let stars = [], shooting = [];

  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function makeStars(count){
    stars = [];
    for(let i=0;i<count;i++){
      stars.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        r: Math.random()*1.5+0.5,
        phase: Math.random()*Math.PI*2,
        speed: Math.random()*0.02+0.01
      });
    }
  }
  makeStars(120);

  function maybeSpawnShootingStar(){
    if(Math.random() < 0.005){
      shooting.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height*0.4,
        len: Math.random()*80+60,
        speed: Math.random()*8+6,
        angle: Math.PI/4,
        life: 1
      });
    }
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    stars.forEach(s=>{
      s.phase += s.speed;
      const twinkle = (Math.sin(s.phase)+1)/2;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${0.2+twinkle*0.6})`;
      ctx.fill();
    });

    maybeSpawnShootingStar();
    shooting.forEach(s=>{
      const dx = Math.cos(s.angle)*s.len;
      const dy = Math.sin(s.angle)*s.len;
      const grad = ctx.createLinearGradient(s.x, s.y, s.x-dx, s.y-dy);
      grad.addColorStop(0, `rgba(255,255,255,${s.life})`);
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x-dx, s.y-dy);
      ctx.stroke();

      s.x += dx*0.15;
      s.y += dy*0.15;
      s.life -= 0.02;
    });
    shooting = shooting.filter(s => s.life > 0);

    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body></html>
